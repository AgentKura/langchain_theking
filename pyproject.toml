[project]
name = "langchain-theking"
version = "0.1.0"
description = "Dependancy file for the projects inside this repository"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chainlit>=2.11.1",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.3.4",
    "langgraph>=1.2.9",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imnot_jarvis"]

[[tool.uv.index]]
name = "<Provide Desired name>"
url = "https://<your-company>.jfrog.io/artifactory/api/pypi/pypi/simple/"
default = true
